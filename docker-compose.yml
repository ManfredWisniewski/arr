services:
  payload:
    image: node:22-alpine
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URI: postgresql://payload_test:payload_test@postgres:5432/payload_test

  postgres:
    restart: always
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payload_test
      POSTGRES_USER: payload_test
      POSTGRES_PASSWORD: payload_test
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payload_test -d payload_test"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  node_modules:
